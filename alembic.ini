# Reach Developments Station — MVP 1.0 Alembic configuration.
#
# The database URL is intentionally NOT configured here. app/db/migrations/env.py
# reads it from app.core.config, so the application and the migration runner
# share exactly one canonical database configuration.

[alembic]
script_location = app/db/migrations

# Repository root on sys.path so that `import app...` resolves inside env.py.
prepend_sys_path = .
path_separator = os

# Revision ids are supplied explicitly so that migration order is readable on
# disk:  alembic revision -m "add project tables" --rev-id "0001_project_land"
file_template = %%(rev)s

# Timestamps are rendered in UTC (see docs/ENGINEERING_RULES.md — dates).
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
