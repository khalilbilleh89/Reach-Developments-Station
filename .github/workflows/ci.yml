# Engineering governance: Smoke for temporary MVP 3 integration, Fast for main
# drafts, and complete sharded Full for ready main candidates and every main push.
# No deployment. Canonical temporary topology: docs/MVP3_ROADMAP.md.
name: CI

on:
  pull_request:
    branches: [main, integration/mvp3, integration/mvp3-management]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Unique main groups also preserve queued main runs (Actions replaces older
  # pending runs even when cancel-in-progress is false in a shared group).
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  development_scope:
    name: Development UI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend_only: ${{ steps.scope.outputs.frontend_only }}
      full_scope: ${{ steps.scope.outputs.full_scope }}
      shards: ${{ steps.width.outputs.shards }}
      shard_count: ${{ steps.width.outputs.shard_count }}
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # How wide Full runs, decided in one place and read by the matrix, the
      # shard command and the job name. It used to be the literal 4 in three
      # spots in this file and three assertions in test_ci_workflow.py, so
      # changing it meant changing six things and hoping.
      #
      # Eight, not more: a single run is then twelve jobs, and a pull request
      # run overlapping a push to main is twenty-four against this account's
      # twenty concurrent jobs. Wider shards would queue and give the time
      # straight back.
      - name: Decide how wide Full runs
        id: width
        env:
          SHARD_COUNT: 8
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          count = int(os.environ["SHARD_COUNT"])
          print(f"shard_count={count}")
          print("shards=" + json.dumps(list(range(1, count + 1))))
          PY
      - name: Check complete delivery scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.ref }}
          CI_HEAD: ${{ github.event.pull_request.head.ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: node scripts/ci_development_ui.mjs

  backend_smoke:
    name: Backend Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'integration/mvp3' || github.event.pull_request.base.ref == 'integration/mvp3-management')
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach_station_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reach_station_test
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Refuse unknown or full-risk integration work
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_backend_smoke.py --base "$PR_BASE_SHA" --out selected-smoke.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify dependency tree
        run: pip check
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Compile
        run: python -m compileall app scripts
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check for model and schema drift
        run: alembic check
      - name: Test smoke backbone and direct contracts
        run: pytest -q $(tr '\n' ' ' < selected-smoke.txt) --durations=20

  backend_fast:
    name: Backend Fast
    runs-on: ubuntu-latest
    needs: development_scope
    if: always() && needs.development_scope.outputs.frontend_only != 'true' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == true
    # Fast runs one domain's closure, not the suite, and finishes well inside a
    # quarter of this. The ceiling stays above Full's so the ordering the CI
    # contract guard asserts still holds, but four hours only ever bought a
    # stuck Draft job a longer silence.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach_station_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reach_station_test
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify dependency tree
        run: pip check
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Compile
        run: python -m compileall app scripts
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check for model and schema drift
        run: alembic check
      - name: Choose downstream tests
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci_backend_tests.py --base "$PR_BASE_SHA" --out selected-tests.txt
      - name: Test targeted (Full fallback retained)
        run: pytest -q $(tr '\n' ' ' < selected-tests.txt) --durations=20

  backend_static:
    name: Backend Static / Structural
    runs-on: ubuntu-latest
    needs: development_scope
    if: always() && needs.development_scope.outputs.frontend_only != 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false))
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach_station_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reach_station_test
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify dependency tree
        run: pip check
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Compile
        run: python -m compileall app scripts
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check for model and schema drift
        run: alembic check
      - name: CI contract guards
        run: pytest -q tests/test_ci_selector.py tests/test_ci_workflow.py tests/test_ci_smoke.py tests/test_ci_shards.py tests/test_deletion_contracts.py
      - name: Validate complete Full assignment
        run: python scripts/ci_backend_shards.py --count ${{ needs.development_scope.outputs.shard_count }} --scope ${{ needs.development_scope.outputs.full_scope || 'all' }}

  backend_full:
    name: Backend Full ${{ matrix.shard }}/${{ needs.development_scope.outputs.shard_count }}
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false)
    # A shard runs its share of the suite in about twenty minutes. The budget
    # is the point at which the job has stopped making progress rather than the
    # point at which it is merely slow: at 120 a stuck shard burned two hours of
    # a runner and was then killed mid-run, naming neither the test nor the
    # statement. The suite now bounds its own lock waits (tests/conftest.py), so
    # a shard that reaches this ceiling has found something that guard does not
    # cover, and half an hour is long enough to say so.
    timeout-minutes: 35
    needs: [development_scope, backend_static]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.development_scope.outputs.shards) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach_station_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reach_station_test
    steps:
      - name: Check out reviewed tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Apply migrations to this shard's own database
        run: alembic upgrade head
      - name: Assign every file exactly once
        run: python scripts/ci_backend_shards.py --shard ${{ matrix.shard }} --count ${{ needs.development_scope.outputs.shard_count }} --out selected-tests.txt --scope ${{ needs.development_scope.outputs.full_scope || 'all' }}
      - name: Test every assigned file
        run: pytest -q $(tr '\n' ' ' < selected-tests.txt) --durations=20

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [development_scope, backend_static, backend_full]
    if: always() && needs.development_scope.outputs.frontend_only != 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false))
    timeout-minutes: 5
    steps:
      - name: Require structure and every Full shard to succeed
        env:
          STRUCTURAL_RESULT: ${{ needs.backend_static.result }}
          SHARDS_RESULT: ${{ needs.backend_full.result }}
        run: python -c 'import os, sys; sys.exit(0 if os.environ["STRUCTURAL_RESULT"] == "success" and os.environ["SHARDS_RESULT"] == "success" else 1)'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Observed at about a minute. Anything near this ceiling is hung, not slow.
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` type-checks the whole project, so a separate tsc pass would
      # be the same work twice. It runs on every push in both states because it
      # finishes in well under a minute.
      - name: Production build
        run: npm run build
