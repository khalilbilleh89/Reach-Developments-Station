# Reach Developments Station — MVP 1.0 continuous integration.
#
# Intentionally lightweight: lint, compile, migrate, test, build. Nothing here
# deploys. Render remains solely responsible for deployment.
#
# CI runs at two speeds on a pull request, and GitHub's own draft state is the
# switch. A commit that reaches main runs the full suite unconditionally.
#
#   Draft               Backend Fast  — structural checks, then the tests the
#                                       change can plausibly break
#   Ready for review    Backend       — structural checks, then every test
#   Pushed to main      Backend       — the same full suite, after the fact
#
# A draft cannot be merged, so a draft does not need the whole suite; a pull
# request marked ready is a merge candidate, so it gets all of it. Every push
# after a pull request is marked ready re-runs the full job, which is what keeps
# the green tick attached to the exact commit somebody would merge rather than
# to an older one.
#
# The main trigger exists because that promise was never self-enforcing. It
# describes what a person should wait for, and a person who does not wait breaks
# nothing: PR #251 was marked ready and merged thirty-three seconds later, so
# the full job's test step began after the merge had already landed and nothing
# it went on to conclude could have stopped anything. Until now, that left main
# in a state no run had ever reported on — not red, which would at least be a
# fact, but unmeasured.
#
# The two triggers ask different questions and neither answers the other's.
# Pre-merge CI asks *may this merge?* and is only binding while somebody is
# waiting for it. Post-merge CI asks *is main sound right now?* and becomes true
# without anybody's patience. A release is cut from main, so main is the branch
# whose health has to be a matter of record.
#
# Only one backend job ever runs for a given event. Fast is not a preview of
# Full; it is the other half of the same decision.

name: CI

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run is waste: nobody will read a verdict on a
  # commit that has already been replaced. A superseded main run is evidence.
  # Each merged commit is the only commit that will ever be tested as itself,
  # and cancelling one leaves a gap in main's record that nothing later refills.
  # So pull request runs still cancel each other, and main runs queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend_fast:
    name: Backend Fast
    runs-on: ubuntu-latest
    # Drafts only, and named against `github.event_name` rather than left to be
    # inferred. On a push there is no pull request in the payload, and Actions
    # coerces a missing value to a number before comparing — so `null == true`
    # is false here by arithmetic rather than by intent. Both backend jobs name
    # the event instead of selecting themselves on that coincidence.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    # The same ceiling as the full job, and it has to be. "Fast" is a selection,
    # not a promise about duration: an unrecognised change deliberately falls
    # back to `pytest -q tests`, so this job's worst case *is* the whole suite.
    # A tighter bound here would kill exactly the fallback runs that matter most.
    timeout-minutes: 120

    services:
      postgres:
        # A throwaway CI database. Never point this at Render PostgreSQL.
        # Fast means fewer relevant tests, never a different database: row
        # locks, partial unique indexes and NUMERIC are the behaviour under
        # test, and SQLite has opinions about all three.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach_station_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reach_station_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the selection is made against the merge base, because
          # a pull request is five commits as often as one and a run that only
          # understood the last patch would miss what the first four changed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Everything from here to the migration drift check is identical to the
      # full job. These are cheap and catch a great deal, so they run on every
      # push whatever the pull request's state. Only the pytest scope differs.

      - name: Verify dependency tree
        run: pip check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Compile
        run: python -m compileall app

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check for model and schema drift
        run: alembic check

      # The base commit comes from the event payload rather than a branch name,
      # so the answer does not change if main moves while the job is queued.
      - name: Choose the tests this change needs
        run: |
          python scripts/ci_backend_tests.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --out selected-tests.txt

      - name: Test (targeted)
        run: pytest -q $(tr '\n' ' ' < selected-tests.txt)

  backend:
    name: Backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # Provisional, and deliberately generous. The documented budget is about
    # forty-five minutes, but the full suite has never once been observed
    # finishing on CI — the run for PR #251 was still inside this job's test
    # step two hours in — so there is no measurement to set this from. Two hours
    # bounds the waste at a third of the six-hour default while leaving well
    # over twice the documented time. A suite that genuinely needs longer than
    # this is a finding to act on, not a number to raise. Tighten it once one
    # run has finished and said what the suite actually costs.
    timeout-minutes: 120

    services:
      postgres:
        # A throwaway CI database. Never point this at Render PostgreSQL.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach_station_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reach_station_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verify dependency tree
        run: pip check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Compile
        run: python -m compileall app

      - name: Apply migrations
        run: alembic upgrade head

      # A difference between the ORM metadata and the migration history is a
      # defect, not background noise: PR-MVP-02 shipped with two of them and
      # only noticed because an unrelated autogenerate run had something to say.
      # This checks; it never generates.
      - name: Check for model and schema drift
        run: alembic check

      # The whole suite, unfiltered. No selection, no --maxfail, no markers,
      # no excluded concurrency tests. This is the result a merge is allowed to
      # rely on, and it is only trustworthy if it is genuinely everything.
      - name: Test
        run: pytest -q --durations=20

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Observed at about a minute. Anything near this ceiling is hung, not slow.
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` type-checks the whole project, so a separate tsc pass would
      # be the same work twice. It runs on every push in both states because it
      # finishes in well under a minute.
      - name: Production build
        run: npm run build
