# Required PR checks are named Backend and Frontend. Backend breadth is decided
# by code risk, never by Draft/Ready state.
name: CI

on:
  pull_request:
    branches: [main, integration/mvp3, integration/mvp3-management]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Backend scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      risk: ${{ steps.plan.outputs.risk }}
      backend_required: ${{ steps.plan.outputs.backend_required }}
      full_required: ${{ steps.plan.outputs.full_required }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
      targeted_shards: ${{ steps.plan.outputs.targeted_shards }}
    steps:
      - name: Check out exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Build risk-based backend plan
        id: plan
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_backend_tests.py --base "$DIFF_BASE" --head "$DIFF_HEAD" --out selected-tests.txt
      - name: Upload selected test plan
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-plan
          path: selected-tests.txt
          if-no-files-found: error

  backend_targeted:
    name: Backend targeted ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.backend_required == 'true' && needs.scope.outputs.full_required != 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.targeted_shards) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach_station_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reach_station_test
    steps:
      - name: Check out exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Download selected test plan
        uses: actions/download-artifact@v4
        with:
          name: backend-test-plan
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify dependency tree
        run: pip check
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Compile
        run: python -m compileall app scripts
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check for model and schema drift
        run: alembic check
      - name: Assign selected tests to this targeted shard
        run: python scripts/ci_backend_shards.py --input selected-tests.txt --shard ${{ matrix.shard }} --count ${{ strategy.job-total }} --out assigned-tests.txt
      - name: Test invariants, domains, and direct consumers
        shell: bash
        run: |
          started=$(date +%s)
          pytest -q $(tr '\n' ' ' < assigned-tests.txt) --durations=20
          elapsed=$(( $(date +%s) - started ))
          echo "Backend targeted duration: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed > 900 )); then
            echo "::warning::Targeted Backend exceeded the 15-minute investigation threshold (${elapsed}s)."
          fi

  backend_system_static:
    name: Backend system static
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.full_required == 'true'
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach_station_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reach_station_test
    steps:
      - name: Check out exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Verify dependency tree
        run: pip check
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Compile
        run: python -m compileall app scripts
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check for model and schema drift
        run: alembic check
      - name: Test CI and repository invariants
        run: pytest -q tests/test_ci_selector.py tests/test_ci_workflow.py tests/test_ci_smoke.py tests/test_ci_shards.py tests/test_test_isolation.py tests/test_deletion_contracts.py tests/test_pr_quality.py
      - name: Validate complete system-risk assignment
        run: python scripts/ci_backend_shards.py --count 8

  backend_system_full:
    name: Backend system Full ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    needs: [scope, backend_system_static]
    if: needs.scope.outputs.full_required == 'true' && needs.backend_system_static.result == 'success'
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reach_station_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "false"
      TZ: UTC
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/reach_station_test
    steps:
      - name: Check out exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Apply migrations to this shard's database
        run: alembic upgrade head
      - name: Assign every test file exactly once
        run: python scripts/ci_backend_shards.py --shard ${{ matrix.shard }} --count 8 --out selected-tests.txt
      - name: Test every assigned file
        run: pytest -q $(tr '\n' ' ' < selected-tests.txt) --durations=20

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [scope, backend_targeted, backend_system_static, backend_system_full]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require the selected backend lane
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BACKEND_REQUIRED: ${{ needs.scope.outputs.backend_required }}
          FULL_REQUIRED: ${{ needs.scope.outputs.full_required }}
          TARGETED_RESULT: ${{ needs.backend_targeted.result }}
          SYSTEM_STATIC_RESULT: ${{ needs.backend_system_static.result }}
          SYSTEM_FULL_RESULT: ${{ needs.backend_system_full.result }}
        run: |
          python - <<'PY'
          import os, sys
          if os.environ["SCOPE_RESULT"] != "success":
              sys.exit("Backend scope failed")
          if os.environ["BACKEND_REQUIRED"] != "true":
              print("No backend-affecting files changed — PASS")
              raise SystemExit(0)
          if os.environ["FULL_REQUIRED"] == "true":
              ok = os.environ["SYSTEM_STATIC_RESULT"] == os.environ["SYSTEM_FULL_RESULT"] == "success"
          else:
              ok = os.environ["TARGETED_RESULT"] == "success"
          raise SystemExit(0 if ok else 1)
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build and complete frontend tests
        # package.json runs npm test as the prebuild step.
        run: npm run build
